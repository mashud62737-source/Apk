name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: ${JAVA_HOME}"
          if [ -z "${JAVA_HOME}" ]; then
            echo "ERROR: JAVA_HOME is not set." >&2
            exit 1
          fi
          JAVA_VER_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Raw version line: ${JAVA_VER_OUTPUT}"
          JAVA_MAJOR=$(echo "${JAVA_VER_OUTPUT}" | sed -E 's/.*version "([0-9]+).*/\1/')
          if [ -z "${JAVA_MAJOR}" ] || ! [[ "${JAVA_MAJOR}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not detect Java major version from output: ${JAVA_VER_OUTPUT}" >&2
            exit 1
          fi
          echo "Detected Java Major Version: ${JAVA_MAJOR}"
          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "ERROR: Java major version ${JAVA_MAJOR} is lower than required version 17." >&2
            exit 1
          fi
          echo "Java environment verified successfully (version ${JAVA_MAJOR} >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "Checking for debug keystore..."
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: debug.keystore could not be found or created." >&2
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "ERROR: Expected APK not found at ${EXPECTED_APK}." >&2
            echo "Searching within app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "ERROR: ${EXPECTED_APK} exists but is empty (0 bytes)." >&2
            exit 1
          fi
          case "${EXPECTED_APK}" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension." >&2; exit 1 ;;
          esac
          echo "Verified debug APK: ${EXPECTED_APK} ($(ls -lh ${EXPECTED_APK} | awk '{print $5}'))"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RELEASE_DIR="${RUNNER_TEMP}/release-assets"
          mkdir -p "${RELEASE_DIR}"
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO_NAME=$(echo "${RAW_REPO_NAME}" | tr -c 'a-zA-Z0-9_-' '-' | tr '[:upper:]' '[:lower:]' | sed 's/--*/-/g; s/^-//; s/-$//')
          if [ -z "${SANITIZED_REPO_NAME}" ]; then
            SANITIZED_REPO_NAME="android-app"
          fi
          ASSET_FILENAME="${SANITIZED_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${RELEASE_DIR}/${ASSET_FILENAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "${ASSET_PATH}"
          if [ ! -s "${ASSET_PATH}" ]; then
            echo "ERROR: Prepared release asset is missing or empty at ${ASSET_PATH}." >&2
            exit 1
          fi
          echo "Prepared release asset: ${ASSET_PATH} (${ASSET_FILENAME})"
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== GitHub CLI Verification ==="
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "ERROR: Release asset ${ASSET_PATH} is missing or empty." >&2
            exit 1
          fi
          case "${ASSET_PATH}" in
            *.apk) ;;
            *) echo "ERROR: Release asset is not a .apk file." >&2; exit 1 ;;
          esac
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES=$(cat <<EOF
          ### 📱 TokTok Debug APK Build #${GITHUB_RUN_NUMBER}

          - **Build Type:** Automatically generated debug APK
          - **Built By:** GitHub Actions
          - **Run Number:** ${GITHUB_RUN_NUMBER}
          - **Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Commit SHA:** ${GITHUB_SHA}
          - **Keystore:** Signed with a temporary debug keystore

          > ⚠️ **Notice:** This APK is intended for testing and verification purposes only. It is not a Play Store production release.
          EOF
          )
          echo "Creating GitHub Release with tag: ${RELEASE_TAG}..."
          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --target "${GITHUB_SHA}" \
            --notes "${RELEASE_NOTES}" \
            --latest
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Build & Release Summary ==="
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          if [ "${RELEASE_OUTCOME}" = "success" ]; then
            echo "GitHub Release published successfully!"
            gh release view "${RELEASE_TAG}" || true
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"
            {
              echo "### 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "- **Direct Download (GitHub Release):** [Download ${ASSET_NAME}](${RELEASE_URL})"
              echo "- **Release Page:** [View Release ${RELEASE_TAG}](${RELEASE_URL})"
              echo "- **Backup Artifact:** The standard GitHub Actions artifact \`app-debug-apk\` is also available under the workflow run summary."
              echo "- **Commit:** \`${GITHUB_SHA}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release creation was not completed or encountered an issue."
            echo "The debug APK was built successfully and the Actions artifact 'app-debug-apk' remains available for download."
            {
              echo "### ⚠️ Debug APK Build Succeeded (Release Notice)"
              echo ""
              echo "- **APK Build Status:** ✅ Succeeded"
              echo "- **Artifact Download:** The verified debug APK is available as the GitHub Actions artifact **\`app-debug-apk\`** on this workflow run."
              echo "- **Release Notice:** Direct GitHub Release publishing was skipped or encountered a permission/network limitation."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
